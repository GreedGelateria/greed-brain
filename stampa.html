<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stampa un biglietto — GREED Brain</title>
<style>
  :root{ --verde:#2d4a22; --verde2:#4a6b34; --linea:#dfe6d8; --muted:#6b7a63; --bg:#f6f8f4; --rosso:#b23a2b; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:#1f2a1a; }
  header{ background:var(--verde); color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header a{ color:#fff; opacity:.85; text-decoration:none; font-size:14px; }
  h1{ font-size:19px; margin:0; }
  main{ max-width:980px; margin:0 auto; padding:16px; display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start; }
  @media (max-width:760px){ main{ grid-template-columns:1fr; } }
  .pannello{ background:#fff; border:1px solid var(--linea); border-radius:12px; padding:16px; }
  textarea{ width:100%; min-height:190px; padding:12px; font-size:18px; line-height:1.4; border:1px solid var(--linea); border-radius:10px; resize:vertical; font-family:inherit; }
  textarea:focus, button:focus-visible, select:focus-visible{ outline:3px solid #a9c48f; outline-offset:2px; }
  .opzioni{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:14px 0; }
  .opzioni label{ font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:5px; }
  select{ padding:10px; border:1px solid var(--linea); border-radius:8px; font-size:16px; background:#fff; }
  .seg{ display:flex; border:1px solid var(--linea); border-radius:8px; overflow:hidden; }
  .seg button{ flex:1; background:#fff; color:var(--verde); border:none; padding:10px 6px; font-size:15px; font-weight:600; cursor:pointer; }
  .seg button[aria-pressed="true"]{ background:var(--verde2); color:#fff; }
  .invia{ width:100%; padding:16px; border:none; border-radius:10px; background:var(--verde); color:#fff; font-size:18px; font-weight:700; cursor:pointer; }
  .invia:disabled{ opacity:.5; cursor:default; }
  .esito{ margin-top:12px; font-size:15px; min-height:22px; }
  .esito.ok{ color:var(--verde2); font-weight:600; } .esito.err{ color:var(--rosso); font-weight:600; }
  .nota{ font-size:12px; color:var(--muted); margin-top:6px; }
  /* anteprima: lo scontrino come uscirà dalla stampante */
  .anteprima h2{ font-size:14px; color:var(--muted); font-weight:600; margin:0 0 8px; }
  .scontrino{ background:#fff; width:100%; max-width:320px; margin:0 auto; padding:18px 14px 26px; font-family:'Courier New',monospace; font-size:13px; line-height:1.35; color:#111;
    box-shadow:0 1px 0 var(--linea); border:1px solid var(--linea);
    -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0/14px 100% repeat-x; mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0/14px 100% repeat-x; }
  .scontrino .riga{ white-space:pre-wrap; word-break:break-word; }
  .c{ text-align:center; } .g{ font-size:24px; font-weight:700; line-height:1.2; } .b{ font-weight:700; }
  .tratto{ border-top:1px dashed #888; margin:8px 0; }
  .vuoto{ color:#aaa; }
</style>
</head>
<body>
<header>
  <h1>🖨️ Stampa un biglietto</h1>
  <a href="index.html">← Dashboard</a>
</header>
<main>
  <section class="pannello">
    <textarea id="testo" placeholder="Scrivi qui il testo da stampare…" maxlength="1500"></textarea>
    <div class="opzioni">
      <label>Dimensione
        <div class="seg" data-gruppo="dim"><button data-v="normale">Normale</button><button data-v="grande">Grande</button></div>
      </label>
      <label>Allineamento
        <div class="seg" data-gruppo="all"><button data-v="sinistra">Sinistra</button><button data-v="centro">Centro</button></div>
      </label>
      <label>Intestazione GREED
        <div class="seg" data-gruppo="int"><button data-v="si">Sì</button><button data-v="no">No</button></div>
      </label>
      <label>Copie
        <select id="copie"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      </label>
    </div>
    <button class="invia" id="invia" disabled>Stampa</button>
    <div class="esito" id="esito" role="status"></div>
    <div class="nota">Le emoji non si stampano e vengono tolte. La stampa parte entro pochi secondi; se la stampante è spenta, il biglietto viene scartato dopo 5 minuti.</div>
  </section>
  <section class="anteprima">
    <h2>Anteprima</h2>
    <div class="scontrino" id="anteprima"></div>
  </section>
</main>

<script type="module">
import { richiediAccesso } from './accesso.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FB = { apiKey:"AIzaSyBwAZb_A3IjPv7iL0cLhVnWO-Cuw_DD5g4", authDomain:"club-greed.firebaseapp.com", projectId:"club-greed", appId:"1:704669833762:web:917f4c7b104bc8ad39087b" };
const app = initializeApp(FB, 'stampa');
const db = getFirestore(app);
await richiediAccesso(app); // stesso login Google delle altre pagine del Brain

const $ = id => document.getElementById(id);
const scelte = { dim:'grande', all:'centro', int:'si' }; // predefiniti decisi da Dario

// ── Testo: tolgo emoji e caratteri che la stampante non sa stampare ──
const pulisci = t => String(t || '')
  .replace(/\r\n?/g, '\n')
  .replace(/[‘’]/g, "'").replace(/[“”«»]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/€/g, 'EUR')
  .replace(/[^\n\x20-\x7E\u00A0-\u00FF]/g, '')   // solo caratteri latini (accenti compresi)
  .replace(/ {2,}/g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{4,}/g, '\n\n\n').trim();
const xmlEsc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const htmlEsc = xmlEsc;

// ── XML ePOS per la TM-m30III (stesso formato di printerJobHandler) ──
function costruisciXml(jobId, testo, o) {
  const al = o.all === 'centro' ? 'center' : 'left';
  const grande = o.dim === 'grande';
  let corpo = '';
  if (o.int === 'si') {
    corpo += `<text align="center" em="true" dw="true" dh="true">GREED\n</text>
        <text align="center" em="false" dw="false" dh="false">Gelateria Naturale - Frascati\n</text>
        <text align="center">--------------------------------\n</text>
        <feed line="1"/>`;
  }
  corpo += `<text align="${al}" em="${grande}" dw="${grande}" dh="${grande}">${xmlEsc(testo)}\n</text>
        <text em="false" dw="false" dh="false"/>
        <feed line="4"/>
        <cut type="feed"/>`;
  const copie = Math.max(1, Math.min(5, o.copie|0));
  return `<?xml version="1.0" encoding="utf-8"?>
<PrintRequestInfo Version="2.00">
  <ePOSPrint>
    <Parameter>
      <devid>local_printer</devid>
      <timeout>10000</timeout>
      <printjobid>${jobId}</printjobid>
    </Parameter>
    <PrintData>
      <epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">
        ${Array(copie).fill(corpo).join('\n        ')}
      </epos-print>
    </PrintData>
  </ePOSPrint>
</PrintRequestInfo>`;
}

// ── Interfaccia ──
document.querySelectorAll('.seg').forEach(g => {
  const k = g.dataset.gruppo;
  g.querySelectorAll('button').forEach(b => {
    b.type = 'button';
    b.setAttribute('aria-pressed', String(b.dataset.v === scelte[k]));
    b.onclick = () => { scelte[k] = b.dataset.v; g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); anteprima(); };
  });
});

function anteprima() {
  const t = pulisci($('testo').value);
  const cls = (scelte.all === 'centro' ? 'c ' : '') + (scelte.dim === 'grande' ? 'g' : '');
  let h = '';
  if (scelte.int === 'si') h += '<div class="c g">GREED</div><div class="c">Gelateria Naturale - Frascati</div><div class="tratto"></div>';
  h += t ? `<div class="riga ${cls}">${htmlEsc(t)}</div>` : '<div class="riga c vuoto">Il testo comparirà qui</div>';
  $('anteprima').innerHTML = h;
  $('invia').disabled = !t;
}
$('testo').addEventListener('input', anteprima);
anteprima();

$('invia').onclick = async () => {
  const testo = pulisci($('testo').value);
  if (!testo) return;
  const ref = doc(collection(db, 'print_jobs'));
  const copie = +$('copie').value;
  $('invia').disabled = true;
  $('esito').className = 'esito'; $('esito').textContent = '⏳ Invio alla stampante…';
  try {
    await setDoc(ref, { tipo:'testo_libero', stampato:false, createdAt:serverTimestamp(), _rawXml: costruisciXml(ref.id, testo, { ...scelte, copie }) });
    $('esito').textContent = '⏳ Inviato, attendo la stampante…';
    // La stampante, quando prende il biglietto, lo toglie dalla coda: così so che è stato stampato.
    let fatto = false;
    const timer = setTimeout(() => { if (!fatto) { stop(); $('esito').className = 'esito err'; $('esito').textContent = 'La stampante non risponde da 60 secondi: controlla che sia accesa e collegata. Il biglietto resta in coda per 5 minuti.'; $('invia').disabled = false; } }, 60000);
    const stop = onSnapshot(ref, s => {
      if (s.exists()) return;
      fatto = true; clearTimeout(timer); stop();
      $('esito').className = 'esito ok'; $('esito').textContent = `✓ Stampato${copie > 1 ? ` (${copie} copie)` : ''}`;
      $('invia').disabled = false;
    }, () => { // lettura non consentita: l'invio è comunque riuscito
      clearTimeout(timer); $('esito').className = 'esito ok'; $('esito').textContent = '✓ Inviato alla stampante'; $('invia').disabled = false;
    });
  } catch (e) {
    $('esito').className = 'esito err';
    $('esito').textContent = 'Invio non riuscito: ' + e.message;
    $('invia').disabled = false;
  }
};
</script>
</body>
</html>
