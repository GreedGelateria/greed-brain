<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREED — Carta d'Identità Prodotto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f0; min-height: 100vh; padding: 16px; }
  .card { max-width: 480px; margin: 0 auto; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.10); }
  .header { background: #1a2e1a; color: white; padding: 20px; }
  .logo { font-size: 28px; font-weight: 900; letter-spacing: 4px; color: #a7c84b; }
  .logo-sub { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 2px; }
  .gusto { font-size: 22px; font-weight: 700; color: white; margin-top: 12px; }
  .lotto-badge { display: inline-block; background: rgba(167,200,75,.2); border: 1px solid #a7c84b; color: #a7c84b; font-family: monospace; font-size: 12px; padding: 3px 8px; border-radius: 6px; margin-top: 6px; }
  .body { padding: 16px; }
  .section { margin-bottom: 16px; }
  .section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .info-box { background: #f7f9f4; border-radius: 8px; padding: 10px; }
  .info-label { font-size: 10px; color: #888; }
  .info-value { font-size: 13px; font-weight: 600; color: #1a2e1a; margin-top: 2px; }
  .ing-row { border: 1px solid #e8ede8; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .ing-nome { font-size: 14px; font-weight: 600; color: #1a2e1a; }
  .ing-qty { font-size: 11px; color: #888; margin-top: 1px; }
  .ing-fornitore { font-size: 12px; color: #444; margin-top: 6px; }
  .ing-lotto { font-size: 11px; color: #c8962b; font-family: monospace; }
  .ing-lotto-dubbio { font-size: 11px; color: #b06a00; margin-top: 3px; }
  .ing-lotto-dubbio span { font-family: monospace; color: #999; }
  .allergeni { background: #fff8e6; border: 1px solid #f0c040; border-radius: 10px; padding: 12px; }
  .allergeni-title { font-size: 11px; font-weight: 700; color: #c8962b; margin-bottom: 4px; }
  .allergeni-list { font-size: 13px; color: #444; }
  .footer { background: #f7f9f4; padding: 12px 16px; font-size: 10px; color: #aaa; text-align: center; border-top: 1px solid #eee; }
  .err { padding: 40px 20px; text-align: center; color: #888; }
  .loading { padding: 40px 20px; text-align: center; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="header">
    <div class="logo">GREED</div>
    <div class="logo-sub">Gelateria Naturale • Piazza Roma 16, Frascati (RM)</div>
    <div class="gusto" id="titolo">Carico...</div>
    <div id="lotto-badge"></div>
  </div>
  <div class="body" id="body">
    <div class="loading">⏳ Carico dati lotto...</div>
  </div>
  <div class="footer" id="footer"></div>
</div>

<script type="module">
// Fase C: la pagina non legge più il database (chiuso), chiede la scheda al server.
// Gli ingredienti sono in ordine di quantità, ma senza dosi: la ricetta resta riservata.
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function main() {
  const lottoId = new URLSearchParams(location.search).get('id');
  if (!lottoId) {
    document.getElementById('titolo').textContent = 'QR non valido';
    document.getElementById('body').innerHTML = '<div class="err">⚠️ Nessun lotto specificato nel QR code.</div>';
    return;
  }
  try {
    const r = await fetch('https://europe-west3-club-greed.cloudfunctions.net/schedaLotto?id=' + encodeURIComponent(lottoId));
    const p = await r.json();
    if (r.status === 404) {
      document.getElementById('titolo').textContent = 'Lotto non trovato';
      document.getElementById('body').innerHTML = `<div class="err">⚠️ Il lotto <strong>${esc(lottoId)}</strong> non è presente nel registro produzioni.</div>`;
      return;
    }
    if (!r.ok || !p.ok) throw new Error(p.error || ('errore ' + r.status));
    document.getElementById('titolo').textContent = p.gusto || '—';
    document.getElementById('lotto-badge').innerHTML = `<span class="lotto-badge">Lotto: ${esc(p.lotto)}</span>`;
    let html = `<div class="section">
      <div class="section-title">📋 Dati produzione</div>
      <div class="info-grid">
        <div class="info-box"><div class="info-label">Data produzione</div><div class="info-value">${esc(p.data || '—')}</div></div>
        <div class="info-box"><div class="info-label">Scadenza</div><div class="info-value">${esc(p.scadenza || '—')}</div></div>
        <div class="info-box"><div class="info-label">Kg prodotti</div><div class="info-value">${esc(p.kg || 0)} kg</div></div>
      </div>
    </div>`;
    if (p.materie && p.materie.length) {
      html += `<div class="section"><div class="section-title">🧂 Materie prime (dalla più abbondante)</div>`;
      p.materie.forEach(m => {
        html += `<div class="ing-row">
          <div class="ing-nome">${esc(m.nome)}</div>
          ${m.fornitore ? `<div class="ing-fornitore">🏭 ${esc(m.fornitore)}</div>` : ''}
          ${m.lotto ? `<div class="ing-lotto">Lotto fornitore: ${esc(m.lotto)}</div>` : ''}
          ${m.lottoDaVerificare ? `<div class="ing-lotto-dubbio">⚠️ Lotto da verificare — la bolla riportava più lotti:<br><span>${esc(m.lottoDaVerificare)}</span></div>` : ''}
        </div>`;
      });
      html += '</div>';
    }
    if (p.allergeni) {
      html += `<div class="section"><div class="allergeni"><div class="allergeni-title">⚠️ ALLERGENI</div><div class="allergeni-list">${esc(p.allergeni)}</div></div></div>`;
    }
    document.getElementById('body').innerHTML = html;
    document.getElementById('footer').textContent =
      `GREED Srl • Via Fontana dell'Oste 142, 00030 Colleferro (RM) • P.IVA 16745501003 • AIC senza glutine dal 2004 • Generato: ${new Date().toLocaleString('it-IT')}`;
  } catch (e) {
    document.getElementById('body').innerHTML = `<div class="err">Scheda non disponibile al momento: ${esc(e.message)}</div>`;
  }
}
main();
</script>
</body>
</html>
