<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libro ingredienti — GREED</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
:root{--verde:#1f3a1a;--verde2:#2d6a4f;--crema:#f6f1e6;--oro:#c8a34a;--rosso:#b33a2b;--arancio:#c27a12;--bordo:#e3d8c2}
*{box-sizing:border-box} body{margin:0;font-family:'Outfit',sans-serif;background:var(--crema);color:#2a2a22}
header{background:var(--verde);color:#f6f1e6;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-family:'Cormorant Garamond',serif;font-size:24px;margin:0;letter-spacing:.04em}
main{max-width:1200px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#fff;border:1px solid #d8ccb4;border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--verde2);color:#fff;border-color:var(--verde2)}
.box{background:#fff;border:1px solid var(--bordo);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.muted{color:#6a6a5a;font-size:13px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:10px;margin:0 4px 0 0;white-space:nowrap}
.ok{background:#e4f2e7;color:#2d6a4f} .warn{background:#fdf0d5;color:#8a5a00} .ko{background:#fbe4e0;color:#a33} .vg{background:#1e7c46;color:#fff} .gf{background:#eef2ea;color:var(--verde2)}
button.b{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--verde2);color:#fff}
button.b2{background:#eef2ea;color:var(--verde2)}
input,select,textarea{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid #d8ccb4;border-radius:6px;width:100%}
textarea{min-height:52px;resize:vertical}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.barra input[type=search]{flex:1;min-width:200px}
.barra label{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.barra label input{width:auto}
/* Libro */
.libro{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.prod{background:#fff;border:1px solid var(--bordo);border-radius:12px;padding:14px 16px;break-inside:avoid}
.prod.vetrina{border-color:var(--oro);box-shadow:0 0 0 2px rgba(200,163,74,.25)}
.prod h3{font-family:'Cormorant Garamond',serif;font-size:22px;margin:0 0 2px;color:var(--verde)}
.prod .tipo{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8a7a5a;margin-bottom:8px}
.prod .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#8a7a5a;margin-top:8px}
.prod .ing{font-size:14px;line-height:1.5}
.prod .ing b,.prod .alg b{color:#7a2214}
.prod .alg{font-size:14px}
.prod .cons{font-size:13px;color:#4a4a3a}
.manca{background:#fdf0d5;border-radius:4px;padding:0 3px}
.avviso{background:#fdf0d5;border:1px solid #f0d9a4;color:#6b4a00;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.intesta{display:none}
/* Schede */
.scheda{background:#fff;border:1px solid var(--bordo);border-radius:12px;padding:20px 24px;margin-bottom:16px}
.scheda h2{font-family:'Cormorant Garamond',serif;font-size:26px;margin:0;color:var(--verde)}
.scheda h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--verde2);margin:16px 0 6px;border-bottom:1px solid var(--bordo);padding-bottom:3px}
.scheda table{width:100%;border-collapse:collapse;font-size:13px}
.scheda td,.scheda th{border-bottom:1px solid #eee5d3;padding:4px 6px;text-align:left;vertical-align:top}
.scheda th{font-size:11px;text-transform:uppercase;color:#8a7a5a}
.scheda .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scheda .bozza{display:inline-block;background:#fbe4e0;color:#a33;font-weight:700;font-size:12px;padding:3px 10px;border-radius:6px;margin-left:8px;vertical-align:middle}
.scheda .kv{display:grid;grid-template-columns:200px 1fr;gap:3px 12px;font-size:13.5px}
.scheda .kv div:nth-child(odd){color:#6a6a5a}
/* Ingredienti */
.ingr{display:grid;grid-template-columns:minmax(180px,1.1fr) 2fr 1fr auto;gap:8px;align-items:start;border-top:1px solid #eee5d3;padding:10px 0}
.ingr:first-child{border-top:0}
@media(max-width:800px){.ingr{grid-template-columns:1fr}.scheda .kv{grid-template-columns:1fr}}
/* Parametri */
.par{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.par label{font-size:12px;font-weight:600;color:#6a6a5a;display:block;margin-bottom:3px}
#login{max-width:420px;margin:60px auto;text-align:center}
@media print{
  header,.tabs,.barra,.avviso,.noprint,button{display:none!important}
  body{background:#fff} main{padding:0;max-width:none}
  .intesta{display:block;font-family:'Cormorant Garamond',serif;font-size:20px;margin-bottom:8px}
  .libro{display:block;columns:2;column-gap:10mm}
  .prod{border:1px solid #bbb;border-radius:0;margin-bottom:4mm;box-shadow:none!important;padding:3mm 4mm}
  .prod h3{font-size:16px} .prod .ing,.prod .alg{font-size:10.5px} .prod .cons,.prod .tipo,.prod .lbl,.prod .alg span{font-size:9.5px!important}
  .manca{background:none}
  .scheda{border:0;border-radius:0;padding:0;margin:0;page-break-after:always}
  .scheda table,.scheda .kv{font-size:10.5px}
}
</style></head><body>
<header><h1>📖 Libro ingredienti</h1><span class="muted" style="color:#d8d0bc" id="chi"></span><span style="flex:1"></span><button class="b b2 noprint" onclick="window.print()">🖨️ Stampa</button></header>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// LIBRO INGREDIENTI (banco, D.Lgs 231/2017 art. 19) e SCHEDE PRODOTTO (HACCP)
// Fonte unica: ricette di produzione del laboratorio (ricette_lab). Le basi usate come
// ingrediente vengono aperte nei loro componenti; gli ingredienti composti prendono i
// componenti da "ingredienti_composti" (compilati da Dario, precompilati dalle schede tecniche).
// ─────────────────────────────────────────────────────────────────────────────
let db, DARIO = false, VISTA = 'libro', SOLO_VETRINA = true, CERCA = '';
let RIC = [], COMP = {}, PAR = null, VETRINA = [], FORN_ING = {};

const ALLERGENI_REGOLE = [
  {k:'LATTE',     re:/\blatte\b(?!\s+di\s+(cocco|soia|mandorl|riso|avena))|panna(?!\s+(soia|vegetale|da cucina alpro))|\bburro\b(?!\s+di\s+(cacao|arachid))|yogurt(?!\s+soia)|ricotta|mascarpone|philadelphia|stracchino|pecorino|parmigiano|caseina|siero di latte|lattosio|formaggi/i},
  {k:'UOVA',      re:/tuorl|\buov[oa]|albume|maionese|savoiard/i},
  {k:'GLUTINE',   re:/frumento|\bgrano\b|farina\s+(di\s+)?(grano|frumento|00|0\b|farro|orzo|segale)|\borzo\b|segale|\bavena\b(?!.*senza glutine)|farro|kamut|biscott(?!.*senza glutine)|\bpane\b|pangrattato|briciole|birra|\bmalto\b/i},
  {k:'FRUTTA A GUSCIO', re:/pistacch|mandorl|nocciol|\bnoc[ei]\b(?!\s+moscata)|anacard|\bpecan|macadamia|noci del brasile|gianduia|pralinat|torrone/i},
  {k:'ARACHIDI',  re:/arachid|peanut/i},
  {k:'SOIA',      re:/\bsoia\b|tofu|edamame/i},
  {k:'PESCE',     re:/\balic[ie]\b|acciug|colatura|tonno|baccal|salmone|merluzz|pesce|sgombr|sardin|worcestershire/i},
  {k:'CROSTACEI', re:/gamber|scamp|aragost|granchi|crostace/i},
  {k:'MOLLUSCHI', re:/cozz|vongol|polp[oi]|calamar|seppi|ostric/i},
  {k:'SEDANO',    re:/sedano/i},
  {k:'SENAPE',    re:/senape/i},
  {k:'SESAMO',    re:/sesamo|tahin/i},
  {k:'SOLFITI',   re:/\bvino\b|marsala|barolo|frascati|moscato|prosecco|vin santo|pedro xim|\baceto\b|spumante|passito|solfit|anidride solforosa/i},
  {k:'LUPINI',    re:/lupin/i},
];
const MAN_ALG = {'latte':'LATTE','uov':'UOVA','glutin':'GLUTINE','guscio':'FRUTTA A GUSCIO','arachid':'ARACHIDI','soia':'SOIA','pesce':'PESCE','crostace':'CROSTACEI','mollusc':'MOLLUSCHI','sedano':'SEDANO','senape':'SENAPE','sesamo':'SESAMO','solfit':'SOLFITI','lupin':'LUPINI'};
const ORDINE_ALG = ALLERGENI_REGOLE.map(a => a.k);
const ANIMALE = /\blatte\b(?!\s+di\s+(cocco|soia|mandorl|riso|avena))|panna(?!\s+(soia|vegetale))|\bburro\b(?!\s+di\s+(cacao|arachid))|yogurt(?!\s+soia)|ricotta|mascarpone|formaggi|pecorino|parmigiano|tuorl|\buov[oa]|albume|miele|gelatina|alic[ie]|acciug|guanciale|pancetta|prosciutto|mortadell|porchett|carne|caseina|lattosio/i;

// Componenti ricavati dalle schede tecniche dei fornitori (posta di gelateriagreed@gmail.com), da confermare in "Ingredienti"
const PRECOMPILATI = [
  { re:/pasta.*pistacch|pistacchio.*(pasta|green|puro)/i, componenti:'pistacchi 100%', tracce:'altra frutta a guscio (mandorle, nocciole)', fonte:'Scheda tecnica Gusto Etna — Pasta di pistacchio Green naturale (febbraio 2026)' },
  { re:/pasta.*nocciol.*igp|nocciol.*igp.*pasta|nocciola piemonte/i, componenti:'nocciole Piemonte IGP tostate 100%', tracce:'', fonte:'Scheda tecnica Corilanga — Pasta di nocciola Piemonte IGP (luglio 2026)' },
  { re:/pasta.*nocciol|nocciol.*pasta/i, componenti:'nocciole tostate 100% (Tonda Gentile Romana)', tracce:'', fonte:'Scheda tecnica Nocciola Market — Pasta di nocciole (luglio 2025)' },
  { re:/meringa/i, componenti:'zucchero, albume d\'uovo, acqua', tracce:'', fonte:'Composizione tipica della meringa italiana: verifica con la tua ricetta' },
  { re:/bombe|bomba/i, componenti:'zucchero, tuorlo d\'uovo, acqua', tracce:'', fonte:'Composizione tipica della pâte à bombe: verifica con la tua ricetta' },
  { re:/proteine.*patata/i, componenti:'proteine di patata', tracce:'latte', fonte:'Scheda tecnica Gioia Group — Proteine di patata Saporepuro (febbraio 2026)' },
  { re:/pan di spagna/i, componenti:'uova, fecola di patate, zucchero, sciroppo di glucosio, umidificante: glicerolo; emulsionante: mono e digliceridi degli acidi grassi (E471); fibra di barbabietola, addensante: gomma di guar; sale, conservante: E202; aroma', tracce:'latte, lupini', fonte:'Scheda tecnica Nocciolcono — Pan di Spagna senza glutine cod. 145 (febbraio 2026)' },
  { re:/con[oi]\b.*(senza glutine|gf)|mini ?con|conett/i, componenti:'farina di riso, amido di mais, fecola di patate, farina di soia, zucchero, olio di semi di girasole alto oleico, emulsionante: lecitina di soia; sale, zucchero caramellizzato, agente lievitante: bicarbonato di sodio; addensanti: gomma guar, gomma xantano; aroma naturale', tracce:'', fonte:'Scheda tecnica Nocciolcono — Mini coni stampati senza glutine cod. 047 (febbraio 2026)' },
];
// Probabili ingredienti composti (vanno scritti con i componenti tra parentesi)
const RE_COMPOSTO = /pasta|crema|cioccolat|copertura|neutro|stabilizz|addensant|meringa|bombe|biscott|cialda|\bcon[oi]\b|pan di spagna|savoiard|granella|pralinat|variegat|marmellat|confettura|salsa|sciroppo(?! di glucosio)|amarett|caramell|gianduia|frollin|wafer|topping|aroma|liquore|\brum\b|vino|marsala|solubile|preparato|\bmix\b|base\b|fondente|gocce|scaglie|praline|crumble|cookie|brownie|torrone|sorbetto/i;

// Parametri di processo per le schede prodotto. Finché Dario non li salva, le schede escono come BOZZA.
const PAR_DEF = {
  confermati: false,
  sede: 'GREED Srl — laboratorio di Via Cernaia 28, 00044 Frascati (RM)',
  vendita: 'GREED Gelateria Naturale — Piazza Roma 16, Frascati',
  claimGlutine: 'Senza glutine: gelateria aderente al circuito AIC (Associazione Italiana Celiachia) dal 2004',
  tracceLab: '',
  confezionamento: 'Vaschette in acciaio inox per la vetrina; per l\'asporto vaschette in polistirolo/carta per alimenti, coni e coppette.',
  lotto: 'Lotto generato in automatico dal gestionale del laboratorio a ogni produzione (numero del registro di produzione), riportato sull\'etichetta di produzione insieme a data di produzione e scadenza.',
  uso: 'Consumo diretto tal quale. Prodotto destinato a tutti i consumatori, compresi i celiaci; non adatto a chi è allergico agli allergeni indicati.',
  controlli: 'Ricevimento merci | Contaminazione, catena del freddo interrotta | Controllo a ogni consegna: DDT, lotto, integrità e temperatura | Prodotti refrigerati ≤ +4 °C, surgelati ≤ -18 °C | Respingere la merce, registrare la non conformità\nPastorizzazione | Sopravvivenza di microrganismi patogeni | Controllo giornaliero: temperatura raggiunta dal pastorizzatore a ogni ciclo | 85 °C miscele base latte e sorbetti; 75 °C miscele con tuorlo | Ripetere il ciclo o eliminare la miscela\nAbbattimento | Moltiplicazione microbica | Controllo giornaliero: temperatura e tempo di abbattimento | Abbattitore a -30 °C per 30 minuti | Prolungare l\'abbattimento; se il gelato non è indurito, eliminarlo\nConservazione e vetrina | Moltiplicazione microbica, scongelamento | Controllo giornaliero: sensori di temperatura con registrazione continua | Armadio negativo -15 °C, vetrina -12/-14 °C | Spostare il prodotto, valutarne lo stato, registrare la non conformità\nAllergeni | Contaminazione crociata | Controllo giornaliero: pulizia di attrezzature e utensili tra un gusto e l\'altro, palette dedicate | Nessun residuo visibile | Ripetere la pulizia; informare il cliente',
  tipi: {
    gelato:     { nome:'Gelato a base latte', pastorizzazione:'Pastorizzazione della miscela a 85 °C', maturazione:'Nessuna: dopo la pastorizzazione la miscela va direttamente in mantecazione', mantecazione:'Mantecatore discontinuo, con aggiunta degli ingredienti di gusto', abbattimento:'Abbattitore a -30 °C per 30 minuti', conservazione:'Armadio negativo a -15 °C', vetrina:'-12 / -14 °C', durata:'', consumatore:'Da consumare subito. Per l\'asporto: conservare in freezer a -18 °C; una volta sciolto non ricongelare.' },
    crema:      { nome:'Gelato con tuorlo (creme, zabaione…)', pastorizzazione:'Pastorizzazione della miscela con tuorlo a 75 °C', maturazione:'Nessuna: dopo la pastorizzazione la miscela va direttamente in mantecazione', mantecazione:'Mantecatore discontinuo, con aggiunta degli ingredienti di gusto', abbattimento:'Abbattitore a -30 °C per 30 minuti', conservazione:'Armadio negativo a -15 °C', vetrina:'-12 / -14 °C', durata:'', consumatore:'Da consumare subito. Per l\'asporto: conservare in freezer a -18 °C; una volta sciolto non ricongelare.' },
    vegano:     { nome:'Gelato vegano / sorbetto', pastorizzazione:'Pastorizzazione a 85 °C della sola miscela (senza frutta); la frutta fresca, lavata, si aggiunge a freddo', maturazione:'Nessuna: dopo la pastorizzazione la miscela va direttamente in mantecazione', mantecazione:'Mantecatore discontinuo', abbattimento:'Abbattitore a -30 °C per 30 minuti', conservazione:'Armadio negativo a -15 °C', vetrina:'-12 / -14 °C', durata:'', consumatore:'Da consumare subito. Per l\'asporto: conservare in freezer a -18 °C; una volta sciolto non ricongelare.' },
    semifreddo: { nome:'Semifreddo', pastorizzazione:'Meringa italiana / pâte à bombe con sciroppo di zucchero cotto a 121 °C versato sugli albumi/tuorli', maturazione:'—', mantecazione:'Montatura e incorporazione delle componenti, colatura negli stampi', abbattimento:'Abbattitore a -30 °C fino al completo indurimento', conservazione:'Armadio negativo a -15 °C', vetrina:'-12 / -14 °C', durata:'', consumatore:'Da consumare il prima possibile. Dalla gelateria al freezer di casa entro 15 minuti; conservare in freezer a -18 °C e togliere 15 minuti prima di servire; una volta scongelato non ricongelare.' },
    torta:      { nome:'Torta gelato', pastorizzazione:'Componenti gelato pastorizzati come da scheda del gelato', maturazione:'—', mantecazione:'Assemblaggio a strati in stampo', abbattimento:'Abbattitore a -30 °C fino al completo indurimento', conservazione:'Armadio negativo a -15 °C', vetrina:'-12 / -14 °C', durata:'', consumatore:'Conservare in freezer a -18 °C. Togliere dal freezer 10 minuti prima di servire; una volta scongelata non ricongelare.' }
  }
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const slug = s => norm(s).replace(/ /g, '-').slice(0, 120) || 'x';
function bello(n) {
  const piccole = new Set(['di','del','della','delle','dei','e','con','al','alla','allo','ai','d','in','da','a']);
  const sigle = new Set(['dop','igp','bio','dpo','gf']);
  return String(n || '').toLowerCase().split(/\s+/).map((w, i) => sigle.has(w) ? w.toUpperCase() : (i > 0 && (piccole.has(w) || /^(all|dell|nell|sull|dall|coll|l|d)'/.test(w))) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
const minuscolo = n => String(n || '').toLowerCase().replace(/\b(dop|igp|bio|gf)\b/g, m => m.toUpperCase());
const eBase = r => r && (r.tipo === 'base' || /^base\b|\bbase\s+(bianca|gialla|latte|frutta|neutra|vegan)/i.test(r.nome));
function trovaBase(nome) { const n = norm(nome); return RIC.find(r => eBase(r) && norm(r.nome) === n); }
function precompilato(nome) { return PRECOMPILATI.find(p => p.re.test(nome)) || null; }
function infoIngrediente(nome) {
  const c = COMP[slug(nome)];
  if (c) return { tipo: c.semplice ? 'semplice' : 'composto', componenti: c.componenti || '', tracce: c.tracce || '', fonte: c.fonte || '', stato: c.semplice ? 'semplice' : (c.componenti ? 'ok' : 'manca') };
  const p = precompilato(nome);
  if (p) return { tipo: 'composto', componenti: p.componenti, tracce: p.tracce, fonte: p.fonte, stato: 'precompilato' };
  if (trovaBase(nome)) return { tipo: 'base', componenti: '', tracce: '', fonte: 'ricetta della base', stato: 'ok' };
  return RE_COMPOSTO.test(nome) ? { tipo: 'composto', componenti: '', tracce: '', fonte: '', stato: 'manca' } : { tipo: 'semplice', componenti: '', tracce: '', fonte: '', stato: 'semplice' };
}
// Dicitura di un ingrediente: semplice, composto con componenti, base aperta nella sua ricetta
function dicitura(nome, prof = 0) {
  const base = prof < 2 && trovaBase(nome);
  if (base && (base.ingredienti || []).length) {
    const dentro = [...base.ingredienti].filter(i => +i.d > 0).sort((a, b) => b.d - a.d).map(i => dicitura(i.nome, prof + 1));
    return { testo: `${minuscolo(nome)} (${dentro.map(x => x.testo).join(', ')})`, mancanti: dentro.flatMap(x => x.mancanti), tracce: dentro.flatMap(x => x.tracce) };
  }
  const info = infoIngrediente(nome);
  if (info.tipo === 'composto' && info.componenti) return { testo: `${minuscolo(nome)} (${info.componenti})`, mancanti: [], tracce: info.tracce ? [info.tracce] : [] };
  return { testo: minuscolo(nome), mancanti: info.stato === 'manca' ? [nome] : [], tracce: [] };
}
function evidenzia(testo) {
  let h = esc(testo);
  ALLERGENI_REGOLE.forEach(a => { h = h.replace(new RegExp(a.re.source, 'gi'), m => `<b>${m}</b>`); });
  h = h.replace(/<b><b>(.*?)<\/b><\/b>/g, '<b>$1</b>');
  // il grassetto prende la parola intera ("pistacchio", non "pistacchi"+"o")
  const L = 'a-zA-ZàèéìòùÀÈÉÌÒÙ';
  return h.replace(new RegExp(`([${L}]*)<b>([^<]+)</b>([${L}]*)`, 'g'), '<b>$1$2$3</b>');
}
// Miscela con tuorlo (anche dentro una base, es. base gialla): pastorizzazione a 75 °C invece di 85 °C
const RE_TUORLO = /tuorl|\buov[oa]\b|zabai|zabagl/i;
function conTuorlo(ing, prof = 0) { return ing.some(i => RE_TUORLO.test(i.nome) || (prof < 2 && (b => b && conTuorlo(b.ingredienti || [], prof + 1))(trovaBase(i.nome)))); }
function prodotto(r) {
  const ing = [...(r.ingredienti || [])].filter(i => i.nome && +i.d > 0).sort((a, b) => b.d - a.d);
